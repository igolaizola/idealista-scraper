<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location ID Search Tool - Idealista Scraper</title>
    <!-- Source: https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js -->
    <script src="assets/lodash.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .intro {
            margin-bottom: 24px;
            padding: 16px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .intro h1 {
            margin: 0 0 12px 0;
            font-size: 24px;
            color: #333;
        }

        .intro p {
            margin: 0;
            color: #666;
            line-height: 1.5;
        }

        .intro a {
            color: #0066cc;
            text-decoration: none;
        }

        .intro a:hover {
            text-decoration: underline;
        }

        .search-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 20px;
        }

        .search-input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .search-input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .table-container {
            position: relative;
            min-height: 200px;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 80px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .data-table th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        .data-table tr:hover {
            background-color: #f9f9f9;
        }

        .id-cell {
            font-family: monospace;
            cursor: pointer;
            background-color: #f8f9fa;
            border-radius: 3px;
            padding: 6px 8px;
            position: relative;
        }

        .id-cell:hover {
            background-color: #e9ecef;
        }

        .tooltip {
            position: absolute;
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .tooltip.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="intro">
        <h1>Idealista Scraper Location ID Search Tool</h1>
        <p>Find location IDs for the Idealista Scraper. Select a country and filter locations. Click any ID to copy it.
        </p>
        <p>Access the scraper: <a href="https://apify.com/igolaizola/idealista-scraper" target="_blank">Idealista
                Scraper on Apify</a></p>
        <p>Created by <a href="https://x.com/igolaizola">@igolaizola</a></p>
    </div>

    <div class="search-container">
        <select id="countrySearch" class="search-input">
            <option value="">Select Country</option>
            <option value="es">Spain (ES)</option>
            <option value="pt">Portugal (PT)</option>
            <option value="it">Italy (IT)</option>
        </select>
        <select id="typeSearch" class="search-input" disabled>
            <option value="">All Types</option>
        </select>
        <input type="text" id="nameSearch" class="search-input" placeholder="Search by name..." disabled>
        <input type="text" id="idSearch" class="search-input" placeholder="Search by ID prefix..." disabled>
    </div>

    <div class="table-container">
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Country</th>
                    <th>Type</th>
                    <th>Name</th>
                    <th>ID</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="4" class="initial-message">Please select a country to view data</td>
                </tr>
            </tbody>
        </table>
        <div id="pagination" style="display:none; margin-top: 12px; align-items: center; gap: 12px;">
            <button id="prevPage" class="search-input" style="width:auto; padding: 8px 14px;">Previous</button>
            <span id="pageInfo"></span>
            <button id="nextPage" class="search-input" style="width:auto; padding: 8px 14px;">Next</button>
        </div>
    </div>

    <script>
        let currentData = [];
        let filteredData = [];
        let searchTimeout = null;
        let currentPage = 1;
        const pageSize = 100;
        let requestId = 0;
        let activeLoadController = null;
        let loadVersion = 0;
        const searchWorker = new Worker('search-worker.js');

        const elements = {
            countrySearch: document.getElementById('countrySearch'),
            typeSearch: document.getElementById('typeSearch'),
            nameSearch: document.getElementById('nameSearch'),
            idSearch: document.getElementById('idSearch'),
            tableBody: document.getElementById('tableBody'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            pagination: document.getElementById('pagination'),
            prevPage: document.getElementById('prevPage'),
            nextPage: document.getElementById('nextPage'),
            pageInfo: document.getElementById('pageInfo')
        };

        const typesByCountry = {
            'es': ['Provincia', 'Municipio', 'Distrito', 'Comarca', 'Barrio'],
            'it': ['Provincia', 'Comune', 'Zona', 'Area', 'Subcomarca', 'Quartiere'],
            'pt': ['Distrito', 'Concelho', 'Zona', 'Freguesia/Zona', 'Bairro']
        };

        function showLoading() {
            elements.loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            elements.loadingOverlay.style.display = 'none';
        }

        function updateTypeDropdown(country) {
            elements.typeSearch.innerHTML = '<option value="">All Types</option>';
            if (country && typesByCountry[country]) {
                typesByCountry[country].forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    elements.typeSearch.appendChild(option);
                });
            }
            elements.typeSearch.disabled = !country;
        }

        function toggleInputs(enable) {
            elements.nameSearch.disabled = !enable;
            elements.idSearch.disabled = !enable;
            elements.typeSearch.disabled = !enable;
        }

        function renderCurrentPage() {
            const country = elements.countrySearch.value.toLowerCase();

            if (!country) {
                elements.pagination.style.display = 'none';
                elements.tableBody.innerHTML = '<tr><td colspan="4">Please select a country to view data</td></tr>';
                return;
            }

            if (filteredData.length === 0) {
                elements.pagination.style.display = 'none';
                elements.tableBody.innerHTML = '<tr><td colspan="4">No matching results found</td></tr>';
            } else {
                const totalPages = Math.ceil(filteredData.length / pageSize);
                const safePage = Math.max(1, Math.min(currentPage, totalPages));
                if (safePage !== currentPage) currentPage = safePage;

                const start = (currentPage - 1) * pageSize;
                const visibleItems = filteredData.slice(start, start + pageSize);

                elements.tableBody.innerHTML = visibleItems.map(item => `
                    <tr>
                        <td>${country.toUpperCase()}</td>
                        <td>${item.type}</td>
                        <td>${item.name}</td>
                        <td><span class="id-cell" onclick="copyId('${item.id}', event)" title="Click to copy">${item.id}</span></td>
                    </tr>
                `).join('');

                elements.pagination.style.display = 'flex';
                elements.pageInfo.textContent = `Showing ${start + 1}-${Math.min(start + pageSize, filteredData.length)} of ${filteredData.length} (Page ${currentPage}/${totalPages})`;
                elements.prevPage.disabled = currentPage === 1;
                elements.nextPage.disabled = currentPage === totalPages;
            }
        }

        function handleSearch() {
            showLoading();
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }
            searchTimeout = setTimeout(() => {
                const country = elements.countrySearch.value.toLowerCase();

                if (!country) {
                    filteredData = [];
                    renderCurrentPage();
                    hideLoading();
                    return;
                }

                currentPage = 1;
                requestId += 1;
                searchWorker.postMessage({
                    action: 'filter',
                    requestId,
                    name: elements.nameSearch.value.toLowerCase(),
                    type: elements.typeSearch.value,
                    id: elements.idSearch.value.toLowerCase()
                });
            }, 300);
        }

        async function copyId(id, event) {
            try {
                await navigator.clipboard.writeText(id);
                const cell = event.target;
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.textContent = 'Copied!';
                cell.appendChild(tooltip);
                tooltip.offsetHeight;
                tooltip.classList.add('show');
                setTimeout(() => {
                    tooltip.classList.remove('show');
                    setTimeout(() => tooltip.remove(), 200);
                }, 1000);
            } catch (err) {
                console.error('Copy failed:', err);
            }
        }

        async function loadCountryData(country) {
            loadVersion += 1;
            const currentLoadVersion = loadVersion;

            if (activeLoadController) {
                activeLoadController.abort();
            }

            activeLoadController = new AbortController();
            showLoading();
            try {
                const response = await fetch(`data/${country}.json`, { signal: activeLoadController.signal });
                if (!response.ok) throw new Error(`Failed to load data for ${country}`);

                if (currentLoadVersion !== loadVersion || elements.countrySearch.value !== country) {
                    if (currentLoadVersion === loadVersion) {
                        hideLoading();
                    }
                    return;
                }

                currentData = (await response.json()).map(item => ({
                    ...item,
                    name_lc: item.name.toLowerCase(),
                    id_lc: item.id.toLowerCase()
                }));
                searchWorker.postMessage({ action: 'setData', data: currentData });
                handleSearch();
            } catch (error) {
                if (error.name === 'AbortError') {
                    if (currentLoadVersion === loadVersion) {
                        hideLoading();
                    }
                    return;
                }

                console.error('Error loading data:', error);
                currentData = [];
                filteredData = [];
                searchWorker.postMessage({ action: 'setData', data: [] });
                elements.tableBody.innerHTML = `<tr><td colspan="4">Error loading data for ${country}. Please try again.</td></tr>`;
                elements.pagination.style.display = 'none';
                if (currentLoadVersion === loadVersion) {
                    hideLoading();
                }
            }
        }

        async function init() {
            elements.countrySearch.addEventListener('change', async e => {
                const country = e.target.value;
                updateTypeDropdown(country);
                toggleInputs(!!country);
                elements.nameSearch.value = '';
                elements.idSearch.value = '';

                if (country) {
                    await loadCountryData(country);
                } else {
                    loadVersion += 1;
                    if (activeLoadController) {
                        activeLoadController.abort();
                        activeLoadController = null;
                    }
                    currentData = [];
                    filteredData = [];
                    searchWorker.postMessage({ action: 'setData', data: [] });
                    renderCurrentPage();
                }
            });

            elements.typeSearch.addEventListener('change', handleSearch);
            elements.nameSearch.addEventListener('input', handleSearch);
            elements.idSearch.addEventListener('input', handleSearch);

            elements.prevPage.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage -= 1;
                    renderCurrentPage();
                }
            });

            elements.nextPage.addEventListener('click', () => {
                const totalPages = Math.ceil(filteredData.length / pageSize);
                if (currentPage < totalPages) {
                    currentPage += 1;
                    renderCurrentPage();
                }
            });

            searchWorker.onmessage = e => {
                if (e.data.requestId !== requestId) return;
                filteredData = e.data.results;
                renderCurrentPage();
                hideLoading();
            };
        }

        init();
    </script>
</body>

</html>
